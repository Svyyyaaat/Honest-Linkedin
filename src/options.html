<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Honest LinkedIn – Settings</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <main>
      <header class="page-head">
        <img src="../icons/icon-48.png" alt="" width="40" height="40" />
        <div>
          <h1>Honest LinkedIn</h1>
          <p class="muted">LinkedIn posts, translated into what they actually mean.</p>
        </div>
      </header>

      <div class="notice" id="linkedin-access" hidden>
        The extension isn't allowed to run on linkedin.com yet.
        <button type="button" id="grant-linkedin">Allow on LinkedIn</button>
      </div>

      <section class="card">
        <h2>Mode</h2>
        <div class="row-2">
          <label class="mode">
            <input type="radio" name="mode" value="button" />
            <span>
              <strong>Click to honestify</strong>
              <small>A button on every post. Tokens are only spent when you click.</small>
            </span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="auto" />
            <span>
              <strong>Auto as you scroll</strong>
              <small>Translates a post once it has been on screen for about a second. Nothing is fetched in advance.</small>
            </span>
          </label>
        </div>
        <label class="check">
          <input type="checkbox" id="enabled" />
          Enabled
        </label>
      </section>

      <section class="card">
        <h2>Model</h2>

        <label for="provider">Provider</label>
        <select id="provider"></select>

        <div class="row-2 wide-first">
          <div>
            <label for="baseUrl">API endpoint</label>
            <input id="baseUrl" type="url" spellcheck="false" placeholder="https://…/v1" />
          </div>
          <div>
            <label for="format">API format</label>
            <select id="format">
              <option value="openai">OpenAI-compatible</option>
              <option value="anthropic">Anthropic Messages</option>
            </select>
          </div>
        </div>

        <label for="apiKey">API key <span class="muted" id="key-optional"></span></label>
        <div class="input-group">
          <input id="apiKey" type="password" spellcheck="false" autocomplete="off" />
          <button type="button" class="secondary" id="toggle-key">Show</button>
        </div>
        <p class="hint">Stored only in this browser and sent only to the endpoint above.</p>

        <label for="model">Model</label>
        <div class="input-group">
          <select id="model"></select>
          <button type="button" class="secondary" id="refresh-models" title="Fetch the model list from the API">
            Fetch models
          </button>
        </div>
        <input id="customModel" type="text" spellcheck="false" placeholder="Model name, e.g. my-model:latest" hidden />
        <p class="hint" id="model-hint"></p>
      </section>

      <section class="card">
        <h2>Extra instructions <span class="muted">(optional)</span></h2>
        <textarea
          id="extraInstructions"
          rows="2"
          placeholder="e.g. Be a bit gentler. Or: Answer like a tired British civil servant."
        ></textarea>
      </section>

      <div class="actions">
        <button type="button" id="save">Save</button>
        <span id="status" role="status"></span>
      </div>

      <section class="card">
        <h2>Try it</h2>
        <textarea id="sample" rows="4"></textarea>
        <div class="actions">
          <button type="button" class="secondary" id="test">Honestify this</button>
          <button type="button" class="link" id="clear-cache">Clear saved translations</button>
        </div>
        <div class="result" id="test-result" hidden></div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
